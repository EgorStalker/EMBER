<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMBER - Predictive Wildfire Intelligence Platform</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
          
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">
        <h1>EMBER system</h1>
        <p class="subtitle">Predictive Wildfire Intelligence Platform</p>
        <hr>
        
        <div class="slider-container">
            <span id="time-label">Прогноз времени: 24ч</span>
            <input type="range" id="time-slider" min="0" max="24" value="24">
        </div>
        
        <hr>
        
        <div id="stats">Загрузка данных...</div>
        
        <div class="threats-section" style="margin-top: 15px;">
            <p style="font-weight: 600; font-size: 14px; margin-bottom: 10px; color: #e2e8f0;">
                Активные угрозы (Клик для перехода):
            </p>
            <div id="fires-list"></div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
            
    <script src="app.js"></script>

</body>
</html>
